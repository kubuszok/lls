name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `generate` is the ONLY job that touches the libGDX submodule and runs Baltic Porter; it stores the
# generated sources in the Actions cache and every test job restores them by key. The engine is
# resolved as a published artifact (project/plugins.sbt) — nothing clones or compiles it.
# The toolchain is defined once, in .github/actions/setup-scala.

jobs:
  # ─── Scalafmt check ────────────────────────────────────────────────

  format:
    name: Scalafmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala

      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"

  # ─── Generate (Baltic Porter) ───────────────────────────────────────

  generate:
    name: Generate port (Baltic Porter)
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.port.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        id: port
        with:
          mode: generate

  # ─── JVM tests (6 desktop platforms) ───────────────────────────────

  test-jvm:
    name: JVM tests (${{ matrix.label }})
    needs: [generate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos-x86_64
            architecture: x64
          - os: macos-latest
            label: macos-aarch64
          - os: windows-latest
            label: windows-x86_64
          - os: windows-11-arm
            label: windows-aarch64
            architecture: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala
        with:
          architecture: ${{ matrix.architecture || '' }}

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Run JVM tests with coverage
        run: sbt ci-jvm-3

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: target/out/jvm/scala-3.8.4/lls-build/scoverage-report/scoverage.xml
          flags: ${{ matrix.label }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Scala.js tests ────────────────────────────────────────────────

  test-js:
    name: Scala.js tests
    needs: [generate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Run Scala.js tests
        run: sbt test-js-3

  # ─── Scala Native tests (5 desktop platforms) ──────────────────────

  test-native:
    name: Native tests (${{ matrix.label }})
    needs: [generate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos-x86_64
            architecture: x64
          - os: macos-latest
            label: macos-aarch64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-scala
        with:
          architecture: ${{ matrix.architecture || '' }}

      - uses: ./.github/actions/generated-port
        with:
          key: ${{ needs.generate.outputs.key }}

      - name: Install Scala Native system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libc++-dev

      - name: Install Scala Native system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --yes

      - name: Run Scala Native tests
        run: sbt test-native-3
