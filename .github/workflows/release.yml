name: Sonatype Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["*"]

env:
  JVM_VERSION: "temurin:1.17.0.15"

jobs:
  build-and-publish:
    # PR snapshots let a change be tested before merging. Bot (Dependabot, Scala Steward) and fork PRs get no
    # secrets, so only trusted authors' PRs publish. Never drop this guard while `pull_request` is a trigger.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest

    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Publish Tag as Release' || 'Publish Snapshot' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import GPG key for signing the release
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: ./.github/actions/setup-scala
        with:
          jvm: ${{ env.JVM_VERSION }}
      # the generated sources must be in the published JAR; the engine is a published artifact
      - uses: ./.github/actions/generated-port
        with:
          mode: generate
      - name: Publish all projects
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
